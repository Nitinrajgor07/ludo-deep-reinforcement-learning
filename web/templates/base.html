<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} | PhD Ludo DRL Platform</title>
    <meta name="description" content="PhD Ludo DRL Platform for Deep Reinforcement Learning in Multi-Agent Ludo Environment.">
    <!-- Deep Cosmic AI Design System -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/theme.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>

    <div class="app-shell">
        <!-- Top Horizontal Navigation Header -->
        <header class="top-navbar">
            <div class="topbar-left">
                <a href="/dashboard" class="topbar-brand">
                    <div class="brand-mark">✦</div>
                    <div class="brand-text">
                        <div class="brand-title">Ludo DRL Lab</div>
                        <div class="brand-subtitle">Cosmic AI Platform</div>
                    </div>
                </a>
            </div>

            <nav class="top-nav" aria-label="Primary navigation">
                <a href="/dashboard" class="top-nav-item {% if active_page == 'dashboard' %}active{% endif %}">
                    <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></span>
                    <span>Dashboard</span>
                </a>
                <a href="/results" class="top-nav-item {% if active_page == 'results' %}active{% endif %}">
                    <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg></span>
                    <span>Results Hub</span>
                </a>
                <a href="/ludo" class="top-nav-item {% if active_page == 'ludo' %}active{% endif %}">
                    <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1"/><circle cx="15" cy="15" r="1"/><circle cx="15" cy="9" r="1"/><circle cx="9" cy="15" r="1"/></svg></span>
                    <span>Ludo Arena</span>
                </a>
                <a href="/models" class="top-nav-item {% if active_page == 'models' %}active{% endif %}">
                    <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a4 4 0 0 0-4 4v1H6a3 3 0 0 0 0 6h2v2a3 3 0 0 0 6 0v-2h2a3 3 0 0 0 0-6h-2V7a4 4 0 0 0-4-4Z"/><path d="M9 12h.01M15 12h.01"/></svg></span>
                    <span>DRL Models</span>
                </a>
            </nav>

            <div class="topbar-right">
                <span class="badge badge-emerald" style="font-size: 11px; padding: 4px 10px; font-weight: 600;">Pilot Verified</span>
            </div>
        </header>

        <!-- Main Workspace Area -->
        <div class="main-area">
            <!-- Dynamic Content -->
            <main class="page-content">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- Image Preview Modal -->
    <div id="imageModal" class="modal-overlay" onclick="closeModal()">
        <div class="modal-box" onclick="event.stopPropagation()">
            <button class="modal-close-btn" onclick="closeModal()" aria-label="Close image preview">&times;</button>
            <img id="modalImg" src="" alt="Figure Zoom">
            <div id="modalCaption" class="modal-caption" style="color: var(--text-secondary); margin-top: 10px; font-size: 13px;"></div>
        </div>
    </div>

    <script src="{{ url_for('static', path='js/main.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
