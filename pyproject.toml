[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "phd_ludo_drl"
version = "1.0.0"

description = "PhD Project: Comparative Study of Deep Reinforcement Learning on Ludo using DQN, PPO, Discrete SAC, and C51"

readme = "README.md"

requires-python = ">=3.10"

license = "MIT"

authors = [
    { name = "Adithya Tej", email = "researcher@example.com" }
]

keywords = [
    "reinforcement-learning",
    "deep-rl",
    "ludo",
    "dqn",
    "ppo",
    "discrete-sac",
    "c51",
    "game-ai",
    "phd-project"
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "gymnasium>=0.29.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "tabulate>=0.9.0",
    "psutil>=5.9.0",

    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9"
]


[project.optional-dependencies]

test = [
    "pytest>=8.0.0"
]

dev = [
    "pytest>=8.0.0"
]

all = [
    "pytest>=8.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9"
]


[project.scripts]

ludo-web = "web.app:main"


[tool.setuptools.packages.find]

include = [
    "phd_ludo_drl*",
    "web*"
]

exclude = [
    "tests*",
    "configs*",
    "results*",
    "experiments*",
    "docs*",
    ".agent*",
    ".agents*",
    ".gemini*",
    ".gsd*"
]


[tool.pytest.ini_options]

minversion = "7.0"

testpaths = [
    "tests"
]

pythonpath = [
    "."
]

addopts = "-v --tb=short"